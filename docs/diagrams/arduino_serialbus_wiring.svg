<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222" />
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #222; stroke-width: 2; rx: 10; }
      .title { font-family: Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #111; }
      .text  { font-family: Segoe UI, Arial, sans-serif; font-size: 14px; fill: #111; }
      .sub   { font-family: Segoe UI, Arial, sans-serif; font-size: 12px; fill: #333; }
      .wire  { stroke: #222; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .wire2 { stroke: #222; stroke-width: 2.2; fill: none; }
      .gnd   { stroke: #555; stroke-width: 2.2; fill: none; }
      .pwr   { stroke: #b00020; stroke-width: 2.6; fill: none; }
      .lbl   { font-family: Segoe UI, Arial, sans-serif; font-size: 12px; fill: #111; }
      .pill  { fill: #f6f6f6; stroke: #999; stroke-width: 1; rx: 8; }
      .note  { font-family: Segoe UI, Arial, sans-serif; font-size: 12px; fill: #444; }
    </style>
  </defs>

  <!-- Header -->
  <text x="40" y="46" class="title">DB3000 Wiring — Arduino Nano + Debug Board + Serial Bus Pan/Tilt + Trigger + LED/Laser + Current Sensors</text>
  <text x="40" y="70" class="sub">Pan/Tilt are serial-bus servos via debug board. Trigger remains separate (PWM trigger servo OR MOSFET). All grounds must be common.</text>

  <!-- Arduino Nano -->
  <rect x="60" y="120" width="340" height="260" class="box"/>
  <text x="80" y="155" class="title">Arduino Nano</text>
  <text x="80" y="185" class="text">USB to PC: Serial 115200</text>
  <text x="80" y="210" class="text">D11 = Bus TX → Debug RX</text>
  <text x="80" y="232" class="text">D10 = Bus RX ← Debug TX</text>
  <text x="80" y="255" class="text">D3  = Trigger Servo PWM</text>
  <text x="80" y="277" class="text">D4  = Trigger MOSFET</text>
  <text x="80" y="299" class="text">D5  = LED output</text>
  <text x="80" y="321" class="text">D6  = Laser output</text>
  <text x="80" y="343" class="text">A0  = Pan current sense</text>
  <text x="80" y="365" class="text">A1  = Tilt current sense</text>
  <text x="80" y="387" class="text">A2  = Total current sense</text>

  <!-- Debug Board -->
  <rect x="540" y="110" width="380" height="210" class="box"/>
  <text x="560" y="145" class="title">Serial Bus Servo Debug Board</text>
  <text x="560" y="175" class="text">UART RX/TX (logic 5V or 3.3V per board)</text>
  <text x="560" y="197" class="text">Servo bus distribution (V+, GND, DATA)</text>
  <text x="560" y="219" class="text">Optional analog current sense outputs</text>
  <text x="560" y="245" class="sub">Power servos from dedicated PSU (NOT Nano 5V)</text>

  <!-- Pan/Tilt servos -->
  <rect x="1040" y="90" width="300" height="120" class="box"/>
  <text x="1060" y="125" class="title">Pan Serial Bus Servo</text>
  <text x="1060" y="155" class="text">Bus ID = 1</text>

  <rect x="1040" y="235" width="300" height="120" class="box"/>
  <text x="1060" y="270" class="title">Tilt Serial Bus Servo</text>
  <text x="1060" y="300" class="text">Bus ID = 2</text>

  <!-- Trigger Servo -->
  <rect x="540" y="395" width="380" height="110" class="box"/>
  <text x="560" y="430" class="title">Trigger Servo (Projectile / BB)</text>
  <text x="560" y="460" class="text">Separate PWM servo on D3</text>

  <!-- MOSFET -->
  <rect x="540" y="545" width="380" height="110" class="box"/>
  <text x="560" y="580" class="title">Trigger MOSFET Driver (Water)</text>
  <text x="560" y="610" class="text">Gate/IN from D4</text>

  <!-- LED / Laser -->
  <rect x="1040" y="395" width="300" height="110" class="box"/>
  <text x="1060" y="430" class="title">LED Driver / Relay</text>
  <text x="1060" y="460" class="text">IN from D5</text>

  <rect x="1040" y="545" width="300" height="110" class="box"/>
  <text x="1060" y="580" class="title">Laser Driver / Relay</text>
  <text x="1060" y="610" class="text">IN from D6</text>

  <!-- Current sensors -->
  <rect x="60" y="435" width="340" height="220" class="box"/>
  <text x="80" y="470" class="title">Current Sensors</text>
  <text x="80" y="500" class="text">Pan current → A0 (from debug board or sensor)</text>
  <text x="80" y="525" class="text">Tilt current → A1 (from debug board or sensor)</text>
  <text x="80" y="550" class="text">Total current → A2 (dedicated sensor)</text>
  <text x="80" y="580" class="sub">All analog outputs must share GND with Nano</text>

  <!-- Power rails -->
  <rect x="60" y="705" width="620" height="150" class="box"/>
  <text x="80" y="740" class="title">Power</text>
  <text x="80" y="770" class="text">5V Logic PSU → Nano + Debug board logic (if required)</text>
  <text x="80" y="795" class="text">Servo PSU (6–8.4V typical) → Debug board V+ + Trigger servo V+</text>
  <text x="80" y="820" class="text">Common GND across Nano, debug board, servos, drivers, sensors</text>

  <!-- Wires: UART -->
  <path class="wire" d="M 400 220 C 470 220, 470 180, 540 180"/>
  <text x="420" y="195" class="lbl">D11 (TX)</text>

  <path class="wire" d="M 540 210 C 470 210, 470 250, 400 250"/>
  <text x="420" y="268" class="lbl">D10 (RX)</text>

  <!-- Wires: Debug board to servos -->
  <path class="wire" d="M 920 155 C 970 155, 990 140, 1040 140"/>
  <text x="940" y="132" class="lbl">Servo Bus</text>

  <path class="wire" d="M 920 255 C 970 255, 990 285, 1040 285"/>
  <text x="940" y="306" class="lbl">Servo Bus</text>

  <!-- Wires: Trigger servo -->
  <path class="wire" d="M 400 270 C 470 270, 470 450, 540 450"/>
  <text x="420" y="444" class="lbl">D3 (PWM)</text>

  <!-- Wires: MOSFET -->
  <path class="wire" d="M 400 295 C 470 295, 470 600, 540 600"/>
  <text x="420" y="590" class="lbl">D4</text>

  <!-- Wires: LED/Laser -->
  <path class="wire" d="M 400 320 C 720 320, 900 440, 1040 440"/>
  <text x="820" y="410" class="lbl">D5</text>

  <path class="wire" d="M 400 345 C 720 345, 900 590, 1040 590"/>
  <text x="820" y="560" class="lbl">D6</text>

  <!-- Wires: Current sense -->
  <path class="wire" d="M 230 655 C 230 690, 230 690, 230 705"/>
  <text x="250" y="690" class="lbl">A0/A1/A2</text>

  <!-- Power rails illustration (simple) -->
  <path class="pwr" d="M 90 760 H 650"/>
  <text x="660" y="764" class="lbl">5V Logic</text>

  <path class="pwr" d="M 90 795 H 650"/>
  <text x="660" y="799" class="lbl">Servo V+</text>

  <path class="gnd" d="M 90 830 H 650"/>
  <text x="660" y="834" class="lbl">GND (common)</text>

  <!-- Footer note -->
  <rect x="720" y="705" width="620" height="150" class="pill"/>
  <text x="740" y="740" class="title">Important Notes</text>
  <text x="740" y="770" class="note">• If your servo bus is half-duplex single-wire, you must use a proper half-duplex driver (or board feature) and change the UART wiring.</text>
  <text x="740" y="795" class="note">• Use a dedicated servo PSU; do not draw servo power from Nano 5V.</text>
  <text x="740" y="820" class="note">• Trigger remains separate: D3 (PWM trigger servo) and D4 (MOSFET water) are not tied to Pan/Tilt bus servos.</text>
</svg>
